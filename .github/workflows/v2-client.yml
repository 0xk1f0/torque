# ABOUTME: Builds the encrypted Sendspin client (spinsync) for every
# ABOUTME: Raspberry Pi architecture plus desktop x86_64, including armv6 for
# ABOUTME: Pi 1 / Zero / Zero W. All cells cross-compile on a single runner.
name: spinsync (Raspberry Pi)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Same tag as the other workflows: skip the libopusfile parts of
# gopkg.in/hraban/opus.v2 so the binary does not link libopusfile at runtime.
env:
  GOFLAGS: -tags=nolibopusfile

jobs:
  # spinsync uses libopus (cgo) and miniaudio (cgo), so the cross cells
  # need a C cross toolchain plus per-architecture libopus/ALSA. Everything is
  # cross-compiled from one ubuntu-latest runner: amd64 is host-native, arm64
  # uses the aarch64-linux-gnu toolchain, and arm32 uses the gnueabihf
  # toolchain. Per-cell CGO_CFLAGS select the exact -march: GOARM alone only
  # affects the Go code, and an armv7-built miniaudio would crash on an armv6
  # CPU (Pi Zero / Zero W).
  test:
    name: Test spinsync
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev libasound2-dev

    - name: Vet
      run: go vet ./pkg/... ./cmd/spinsync/...

    - name: Run spinsync + protocol tests
      run: go test -race -count=1 ./pkg/sendspin/... ./pkg/protocol/...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop x86_64 — host-native, no cross toolchain.
          - name: linux-amd64
            goarch: amd64
            goarm: ""
            cc: ""
            pkgconfig: ""
            cgo_cflags: ""
            deps: native
          # 64-bit Pi OS (Pi 3/4/5, Zero 2 W) — cross aarch64.
          - name: linux-arm64
            goarch: arm64
            goarm: ""
            cc: aarch64-linux-gnu-gcc
            pkgconfig: /usr/lib/aarch64-linux-gnu/pkgconfig
            cgo_cflags: ""
            deps: aarch64
          # 32-bit Raspbian (Pi 2/3) — cross gnueabihf, armv7 C code.
          - name: linux-armv7
            goarch: arm
            goarm: "7"
            cc: arm-linux-gnueabihf-gcc
            pkgconfig: /usr/lib/arm-linux-gnueabihf/pkgconfig
            cgo_cflags: -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard
            deps: gnueabihf
          # Pi 1 / Pi Zero / Pi Zero W — cross gnueabihf, armv6 C code.
          - name: linux-armv6
            goarch: arm
            goarm: "6"
            cc: arm-linux-gnueabihf-gcc
            pkgconfig: /usr/lib/arm-linux-gnueabihf/pkgconfig
            cgo_cflags: -march=armv6 -mfpu=vfp -mfloat-abi=hard
            deps: gnueabihf

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Install dependencies (native amd64)
      if: matrix.deps == 'native'
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev libasound2-dev

    # Multiarch enables the cross gcc to find target libopus + ALSA headers/libs.
    - name: Install cross toolchain + deps (aarch64)
      if: matrix.deps == 'aarch64'
      run: |
        sudo dpkg --add-architecture arm64
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu libopus-dev:arm64 libasound2-dev:arm64

    - name: Install cross toolchain + deps (armhf)
      if: matrix.deps == 'gnueabihf'
      run: |
        sudo dpkg --add-architecture armhf
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf libopus-dev:armhf libasound2-dev:armhf

    - name: Get version
      id: version
      run: echo "VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> $GITHUB_OUTPUT

    - name: Build
      run: |
        export CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }}
        [ -n "${{ matrix.cc }}" ]         && export CC=${{ matrix.cc }}
        [ -n "${{ matrix.pkgconfig }}" ]  && export PKG_CONFIG_PATH=${{ matrix.pkgconfig }}
        [ -n "${{ matrix.cgo_cflags }}" ] && export CGO_CFLAGS="${{ matrix.cgo_cflags }}" CGO_LDFLAGS="${{ matrix.cgo_cflags }}"
        LDFLAGS="-X github.com/0xk1f0/spinsync/internal/version.Version=${{ steps.version.outputs.VERSION }} -s -w"
        go build -trimpath -ldflags "${LDFLAGS}" \
          -o spinsync-${{ matrix.name }} ./cmd/spinsync

    # Assert the produced ELF really is the advertised architecture — catches
    # the armv7-compiled-cgo-on-armv6 trap before it reaches a Zero W.
    - name: Verify architecture
      run: |
        file spinsync-${{ matrix.name }}
        if [ "${{ matrix.goarch }}" = "arm" ]; then
          readelf -A spinsync-${{ matrix.name }} | grep -E "Tag_CPU_arch" || true
        fi

    - name: Upload sendspin client
      uses: actions/upload-artifact@v4
      with:
        name: spinsync-${{ matrix.name }}
        path: spinsync-${{ matrix.name }}
