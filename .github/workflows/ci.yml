# ABOUTME: CI for the Sendspin client — tests, vet, and lint on push/PR
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Drop the libopusfile parts of gopkg.in/hraban/opus.v2; the client never
# calls the opus.Stream API, and the tag avoids libopusfile at runtime.
env:
  GOFLAGS: -tags=nolibopusfile

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev libasound2-dev

    # The client SDK (pkg/) must never depend on internal/. Kept permanent as a
    # boundary guard so CLI-specific code can't leak into the SDK.
    - name: SDK boundary guard (pkg/ must not import internal/)
      run: |
        deps=$(go list -deps ./pkg/... | grep 'sendspin-go/internal' || true)
        if [ -n "$deps" ]; then
          echo "::error::pkg/ imports internal/ packages — SDK boundary violated:"
          echo "$deps"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev libasound2-dev shellcheck

    - name: Shellcheck
      run: shellcheck scripts/*.sh

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m
