name: Build all Targets

on:
  workflow_dispatch:

# Same tag as the other workflows: skip the libopusfile parts of
# gopkg.in/hraban/opus.v2 so the binary does not link libopusfile at runtime.
env:
  GOFLAGS: -tags=nolibopusfile

jobs:
  # torque uses libopus (cgo) and miniaudio (cgo), so the cross cells
  # need a C cross toolchain plus per-architecture libopus/ALSA. Everything is
  # cross-compiled from one ubuntu-latest runner: amd64 is host-native, arm64
  # uses the aarch64-linux-gnu toolchain, and arm32 uses the gnueabihf
  # toolchain. Per-cell CGO_CFLAGS select the exact -march: GOARM alone only
  # affects the Go code, and an armv7-built miniaudio would crash on an armv6
  # CPU (Pi Zero / Zero W).
  test:
    name: Test torque
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev libasound2-dev

    - name: Vet
      run: go vet ./pkg/... ./cmd/torque/...

    - name: Run torque + protocol tests
      run: go test -race -count=1 ./pkg/sendspin/... ./pkg/protocol/...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop x86_64 — host-native, no cross toolchain.
          - name: linux-amd64
            goarch: amd64
            goarm: ""
            cc: ""
            dpkg_arch: ""
            triplet: ""
            cgo_cflags: ""
            expect_cpu: ""
          # 64-bit Pi OS (Pi 3/4/5, Zero 2 W) — cross aarch64.
          - name: linux-arm64
            goarch: arm64
            goarm: ""
            cc: aarch64-linux-gnu-gcc
            dpkg_arch: arm64
            triplet: aarch64-linux-gnu
            cgo_cflags: ""
            expect_cpu: ""
          # 32-bit Raspbian (Pi 2/3) — cross gnueabihf, armv7 C code.
          - name: linux-armv7
            goarch: arm
            goarm: "7"
            cc: arm-linux-gnueabihf-gcc
            dpkg_arch: armhf
            triplet: arm-linux-gnueabihf
            cgo_cflags: -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard
            expect_cpu: v7
          # Pi 1 / Pi Zero / Pi Zero W — cross gnueabihf, armv6 C code.
          # Mirrors the Dockerfile's armv6 recipe (-march=armv6 hard-float, GOARM=6).
          # Note: no expect_cpu here — like the Dockerfile, we trust -march rather
          # than assert Tag_CPU_arch, because this cell links Ubuntu's armhf
          # (armv7-baseline) crt/libgcc, which bumps the ELF tag to v7. Genuine
          # armv6 runtime compatibility needs an armv6 userspace (Raspbian).
          - name: linux-armv6
            goarch: arm
            goarm: "6"
            cc: arm-linux-gnueabihf-gcc
            dpkg_arch: armhf
            triplet: arm-linux-gnueabihf
            cgo_cflags: -march=armv6 -mfpu=vfp -mfloat-abi=hard
            expect_cpu: ""

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install dependencies (native amd64)
      if: matrix.dpkg_arch == ''
      run: |
        sudo apt-get update
        sudo apt-get install -y libopus-dev libasound2-dev

    # Ubuntu serves arm64/armhf packages from ports.ubuntu.com, not the
    # default (amd64-only) mirror. Pin the existing sources to amd64 and add a
    # ports source, otherwise `apt-get update` 404s on the foreign arch.
    - name: Install cross toolchain + deps (${{ matrix.dpkg_arch }})
      if: matrix.dpkg_arch != ''
      run: |
        set -eu
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' \
            /etc/apt/sources.list.d/ubuntu.sources
        fi
        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i 's/^deb \(http\)/deb [arch=amd64] \1/' /etc/apt/sources.list
        fi
        printf '%s\n' \
          'Types: deb' \
          'URIs: http://ports.ubuntu.com/ubuntu-ports' \
          "Suites: ${codename} ${codename}-updates ${codename}-security" \
          'Components: main universe' \
          'Architectures: arm64 armhf' \
          'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
          | sudo tee /etc/apt/sources.list.d/ports.sources >/dev/null
        sudo dpkg --add-architecture ${{ matrix.dpkg_arch }}
        sudo apt-get update
        # --allow-downgrades: the runner's preinstalled host binutils/gcc/cross
        # basemeta may be newer than what the mirror serves for this (currently
        # 26.04 "resolute") release, so adding the foreign arch makes apt want
        # to downgrade them. Those host packages are unused in a cross cell
        # (the cross gcc builds the target), so applying the downgrade is safe.
        sudo apt-get install -y --allow-downgrades \
          gcc-${{ matrix.triplet }} binutils-${{ matrix.triplet }} \
          libopus-dev:${{ matrix.dpkg_arch }} libasound2-dev:${{ matrix.dpkg_arch }}

    - name: Get version
      id: version
      run: echo "VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

    - name: Build
      run: |
        set -eu
        export CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }}
        if [ -n "${{ matrix.cc }}" ]; then
          export CC=${{ matrix.cc }}
          # LIBDIR (not PATH) so host .pc files can never leak into a cross build.
          export PKG_CONFIG_LIBDIR=/usr/lib/${{ matrix.triplet }}/pkgconfig:/usr/share/pkgconfig
        fi
        if [ -n "${{ matrix.cgo_cflags }}" ]; then
          export CGO_CFLAGS="${{ matrix.cgo_cflags }}" CGO_LDFLAGS="${{ matrix.cgo_cflags }}"
        fi
        LDFLAGS="-X github.com/0xk1f0/torque/internal/version.Version=${{ steps.version.outputs.VERSION }} -s -w"
        go build -trimpath -ldflags "${LDFLAGS}" \
          -o torque-${{ matrix.name }} ./cmd/torque

    # Assert the produced ELF really is the advertised architecture — catches
    # the armv7-compiled-cgo-on-armv6 trap before it reaches a Zero W.
    # Tag_CPU_arch is the max over every linked object, including the
    # toolchain's crt files and libgcc, so a v7 result here is a real problem.
    - name: Verify architecture
      run: |
        set -eu
        bin=torque-${{ matrix.name }}
        file "$bin"
        if [ -n "${{ matrix.expect_cpu }}" ]; then
          got=$(${{ matrix.triplet }}-readelf -A "$bin" | sed -n 's/^ *Tag_CPU_arch: *//p' | head -n1)
          echo "Tag_CPU_arch: ${got:-<missing>} (expected ${{ matrix.expect_cpu }})"
          case "$got" in
            ${{ matrix.expect_cpu }}*) ;;
            *) echo "::error::$bin is '${got:-unknown}', expected ${{ matrix.expect_cpu }}"; exit 1 ;;
          esac
        fi

    - name: Upload sendspin client
      uses: actions/upload-artifact@v7
      with:
        name: torque-${{ matrix.name }}
        path: torque-${{ matrix.name }}
